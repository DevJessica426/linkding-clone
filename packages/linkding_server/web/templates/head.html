<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/static/favicon.ico" sizes="48x48">
  <link rel="icon"
        href="/static/favicon.svg"
        sizes="any"
        type="image/svg+xml">
  <link rel="apple-touch-icon"
        sizes="180x180"
        href="/static/apple-touch-icon.png">
  <link rel="mask-icon"
        href="/static/safari-pinned-tab.svg"
        color="#5856e0">
  <link rel="manifest" href="/manifest.json">
  <link rel="search"
        type="application/opensearchdescription+xml"
        title="Linkding"
        href="/opensearch.xml" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, minimal-ui">
  <meta name="description" content="Self-hosted bookmark service">
  <meta name="robots" content="index,follow">
  <meta name="author" content="Sascha Ißbrücker">
  <title>{{title}}</title>
{{#themeLight}}
    <link href="/static/theme-light.css?v={{version}}"
          rel="stylesheet"
          type="text/css" />
    <meta name="theme-color" content="#5856e0">
{{/themeLight}}
{{#themeDark}}
    <link href="/static/theme-dark.css?v={{version}}"
          rel="stylesheet"
          type="text/css" />
    <meta name="theme-color" content="#161822">
{{/themeDark}}
{{#themeAuto}}
    <link href="/static/theme-dark.css?v={{version}}"
          rel="stylesheet"
          type="text/css"
          media="(prefers-color-scheme: dark)" />
    <link href="/static/theme-light.css?v={{version}}"
          rel="stylesheet"
          type="text/css"
          media="(prefers-color-scheme: light)" />
    <meta name="theme-color"
          media="(prefers-color-scheme: dark)"
          content="#161822">
    <meta name="theme-color"
          media="(prefers-color-scheme: light)"
          content="#5856e0">
{{/themeAuto}}
{{#hasCustomCss}}
  <link href="/custom_css?hash={{customCssHash}}"
        rel="stylesheet"
        type="text/css" />
{{/hasCustomCss}}
  <meta name="turbo-cache-control" content="no-preview">
{{#noPrefetch}}
  <meta name="turbo-prefetch" content="false">
{{/noPrefetch}}
{{#hasRss}}
  <link rel="alternate" type="application/rss+xml" href="{{rssFeedUrl}}" />
{{/hasRss}}
  <script src="/static/bundle.js?v={{version}}"></script>
</head>
